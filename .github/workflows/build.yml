name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # mise-action's `bootstrap` runs `apt-get install` for
      # [bootstrap.packages]. The runner image ships a stale apt index, so the
      # pinned .debs (libc6-dev-i386 & co, via gcc-multilib) 404 on the mirror
      # unless the index is refreshed first.
      - name: Refresh apt index
        run: sudo apt-get update

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          bootstrap: true
          cache: true

      - name: Install Python dependencies
        run: mise run sync

      - name: Check clang-format
        run: |
          files=$(find applications boards -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \))
          mise x -- clang-format --dry-run --Werror $files

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: rasprover
            flags: --sysbuild
          - app: embedded_vision
          - app: force_sensor
          - app: joystick_controller
          - app: motor_controller
          - app: pico_fw
          # bluetooth_proxy_device needs golioth/pouch, which are not in this
          # workspace (disabled until pouch fixes board.yml full_name requirement)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # See the clang-format job: bootstrap's apt install needs a fresh index.
      - name: Refresh apt index
        run: sudo apt-get update

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          bootstrap: true
          cache: true

      - name: Install Python dependencies
        run: mise run sync

      - name: Cache west deps
        uses: actions/cache@v6
        with:
          path: deps/
          key: west-deps-${{ hashFiles('west.yml') }}
          restore-keys: |
            west-deps-

      - name: Cache Zephyr SDK
        uses: actions/cache@v6
        with:
          path: ~/zephyr-sdk-*
          key: zephyr-sdk-${{ hashFiles('west.yml') }}
          restore-keys: |
            zephyr-sdk-

      - name: Setup workspace
        run: mise run setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build firmware
        run: mise run app ${{ matrix.app }} ${{ matrix.flags }}
