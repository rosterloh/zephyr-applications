name: Build

on:
  # Branch pushes are covered by pull_request, which tests the merge result;
  # an unfiltered `push` would run the whole matrix a second time per PR.
  #
  # paths-ignore skips the whole matrix for changes that cannot affect firmware
  # — six full builds for a docs- or skills-only PR is ~15 min of runner time
  # for no signal. Anything not listed here (applications/, boards/, west.yml,
  # mise.toml, scripts/, tests/, the workflow itself) still triggers.
  # (duplicated rather than a YAML anchor: Actions' parser rejects anchors)
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:
  # Nightly full run on main: saves the day's west-deps cache, so PRs fetch at
  # most a day of zephyr main, and catches upstream breakage with no PR open.
  schedule:
    - cron: '23 3 * * *'

# Install tools strictly from mise.lock: fail if a tool has no pre-resolved
# entry for linux-x64 rather than silently reaching out to GitHub/aqua and
# resolving `latest` to whatever shipped today. Keeps CI on the same toolchain
# versions as a local checkout.
env:
  MISE_LOCKED: 1

# A newer push supersedes whatever is in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This is the only job that bootstraps, so `mise bootstrap` still gets
      # exercised on every run without the build matrix paying ~15s each for
      # apt packages it doesn't need (the runner image already carries dtc,
      # gperf and friends — the builds were green throughout the window where
      # mise-action v3 silently ignored this input).
      #
      # The index refresh is required: the image ships a stale apt index, so the
      # pinned .debs (libc6-dev-i386 & co, via gcc-multilib) 404 on the mirror.
      - name: Refresh apt index
        run: sudo apt-get update

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          bootstrap: true
          cache: true

      # Python 3.15 lacks wheels for pydantic-core/pyyaml/markupsafe, so uv
      # builds them from source (~80s). `prune --ci` keeps only those builds.
      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock', 'mise.toml') }}
          restore-keys: |
            uv-

      - name: Install Python dependencies
        run: |
          mise run sync
          mise x -- uv cache prune --ci

      - name: Check clang-format
        run: |
          files=$(find applications boards -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \))
          mise x -- clang-format --dry-run --Werror $files

  # Routes the build matrix and twister to the apps a PR can affect, via
  # scripts/ci/affected-apps.sh. Pushes to main and manual runs cover everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.route.outputs.matrix }}
      tests: ${{ steps.route.outputs.tests }}
      full: ${{ steps.route.outputs.full }}
      day: ${{ steps.route.outputs.day }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A PR checks out its merge commit; HEAD^1 is the base it merges into.
          fetch-depth: 2

      # bluetooth_proxy_device needs golioth/pouch, which are not in this
      # workspace (disabled until pouch fixes board.yml full_name requirement).
      # protective_stop defaults to native_sim, which the test job covers.
      - name: Route
        id: route
        env:
          MATRIX: |
            [
              {"app": "rasprover", "flags": "--sysbuild"},
              {"app": "data_collection", "flags": "--sysbuild"},
              {"app": "embedded_vision"},
              {"app": "force_sensor"},
              {"app": "joystick_controller"},
              {"app": "motor_controller"},
              {"app": "pico_fw"},
              {"app": "protective_stop", "flags": "--board waveshare_esp32_s3_eth/esp32s3/procpu"}
            ]
        run: |
          ALL=$(ls applications | grep -vx common | sort)
          APPS=$ALL
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            APPS=$(git diff --name-only HEAD^1 HEAD | scripts/ci/affected-apps.sh)
          fi
          # Every app affected (e.g. mise.toml) is a full run, so --min-suites guards it.
          [ "$APPS" = "$ALL" ] && echo "full=true" >> "$GITHUB_OUTPUT" || echo "full=false" >> "$GITHUB_OUTPUT"
          echo "Affected apps:" $APPS
          APPS_JSON=$(printf '%s\n' $APPS | jq -R . | jq -sc 'map(select(. != ""))')
          echo "matrix=$(jq -c --argjson apps "$APPS_JSON" 'map(select(.app as $a | $apps | index($a)))' <<<"$MATRIX")" >> "$GITHUB_OUTPUT"
          # shortcut: an app counts as tested only if it has tests/*/testcase.yaml; widen if one gets runnable scenarios elsewhere.
          TESTS=$(for app in $APPS; do ls applications/"$app"/tests/*/testcase.yaml >/dev/null 2>&1 && echo "$app"; done | xargs)
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          # One day for the whole run, so jobs either side of midnight share a cache key.
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No bootstrap here — see the clang-format job, which owns that coverage.
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      # Python 3.15 lacks wheels for pydantic-core/pyyaml/markupsafe, so uv
      # builds them from source (~80s). `prune --ci` keeps only those builds.
      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock', 'mise.toml') }}
          restore-keys: |
            uv-

      - name: Install Python dependencies
        run: |
          mise run sync
          mise x -- uv cache prune --ci

      # zephyr and rosterloh-drivers track main, so a cache keyed on west.yml
      # alone froze and every job re-fetched everything since. Restore-only here:
      # main saves the day's entry below; a PR-scoped 2.7 GB save would only
      # slow the PR down and be invisible to other PRs.
      - name: Restore west deps
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: deps/
          key: west-deps-${{ hashFiles('west.yml') }}-${{ needs.changes.outputs.day }}
          restore-keys: |
            west-deps-${{ hashFiles('west.yml') }}-
            west-deps-

      - name: Cache Zephyr SDK
        uses: actions/cache@v6
        with:
          path: ~/zephyr-sdk-*
          key: zephyr-sdk-${{ hashFiles('west.yml') }}
          restore-keys: |
            zephyr-sdk-

      # `app` builds with `-p always`, so the build dir is pristine every run and
      # ccache is the only thing that can make the compile phase cheaper: a
      # pristine rebuild hits ~100% once its objects are cached.
      #
      # One entry per app, because the boards share almost no objects (samd21/arm,
      # esp32+esp32s3/xtensa, stm32h7/arm, rp2040/arm). A single shared entry only
      # warms whichever job wins the save race, leaving the other five at ~0% —
      # measured on this branch. Per-app keys warm the whole matrix in one run.
      #
      # Cheap enough to ignore the cache budget: a saved entry is ~5 MiB, so all
      # six are ~0.3% of the 10 GB limit and can't evict west-deps or the SDK.
      # The bare `ccache-` fallback seeds a brand-new app from whatever exists.
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.app }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.app }}-
            ccache-

      - name: Setup workspace
        run: mise run setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After setup, so the entry holds today's updated checkout. Parallel jobs
      # race to save; the losers only log a warning.
      - name: Save west deps
        if: github.event_name != 'pull_request' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Build firmware
        env:
          # A per-app cache measures ~5 MiB, so this is a safety ceiling rather
          # than an allocation — ccache only ever uses what it needs.
          CCACHE_MAXSIZE: 500M
        run: |
          mise x -- ccache --zero-stats
          mise run app ${{ matrix.app }} ${{ matrix.flags }}
          mise x -- ccache --show-stats

  # Parallel to the build matrix: twister on native_sim/qemu needs none of the
  # per-app board plumbing. twister-out/ is never cached, so every run is fresh.
  test:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.tests != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock', 'mise.toml') }}
          restore-keys: |
            uv-

      - name: Install Python dependencies
        run: |
          mise run sync
          mise x -- uv cache prune --ci

      # zephyr and rosterloh-drivers track main, so a cache keyed on west.yml
      # alone froze and every job re-fetched everything since. Restore-only here:
      # main saves the day's entry below; a PR-scoped 2.7 GB save would only
      # slow the PR down and be invisible to other PRs.
      - name: Restore west deps
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: deps/
          key: west-deps-${{ hashFiles('west.yml') }}-${{ needs.changes.outputs.day }}
          restore-keys: |
            west-deps-${{ hashFiles('west.yml') }}-
            west-deps-

      - name: Cache Zephyr SDK
        uses: actions/cache@v6
        with:
          path: ~/zephyr-sdk-*
          key: zephyr-sdk-${{ hashFiles('west.yml') }}
          restore-keys: |
            zephyr-sdk-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-twister-${{ github.run_id }}
          restore-keys: |
            ccache-twister-

      - name: Setup workspace
        run: mise run setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After setup, so the entry holds today's updated checkout. Parallel jobs
      # race to save; the losers only log a warning.
      - name: Save west deps
        if: github.event_name != 'pull_request' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # --runnable: hardware builds are the build matrix's job.
      # On a full run, bump --min-suites when adding a suite. A drop means suites
      # are being filtered out (the native_sim vs native_sim/native/64 trap from #85).
      - name: Run twister
        env:
          CCACHE_MAXSIZE: 500M
          FULL: ${{ needs.changes.outputs.full }}
          TESTS: ${{ needs.changes.outputs.tests }}
        run: |
          if [ "$FULL" = true ]; then
            mise run test --runnable --min-suites 12
          else
            mise run test --runnable $TESTS
          fi
