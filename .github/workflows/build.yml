name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: rasprover
            flags: --sysbuild
          - app: embedded_vision
          - app: force_sensor
          - app: joystick_controller
          - app: motor_controller
          - app: pico_fw
          # bluetooth_proxy_device needs golioth/pouch, which are not in this
          # workspace (disabled until pouch fixes board.yml full_name requirement)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          bootstrap: true
          cache: true

      - name: Install Python dependencies
        run: mise run sync

      - name: Cache west deps
        uses: actions/cache@v6
        with:
          path: deps/
          key: west-deps-${{ hashFiles('west.yml') }}
          restore-keys: |
            west-deps-

      - name: Cache Zephyr SDK
        uses: actions/cache@v6
        with:
          path: ~/zephyr-sdk-*
          key: zephyr-sdk-${{ hashFiles('west.yml') }}
          restore-keys: |
            zephyr-sdk-

      - name: Setup workspace
        run: mise run setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build firmware
        run: mise run app ${{ matrix.app }} ${{ matrix.flags }}
