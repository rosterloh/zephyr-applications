west-commands:
  - file: scripts/west_commands/flash_small_blocks.py
    commands:
      - name: flash-small-blocks
        class: FlashSmallBlocks
        help: flash an Espressif image in small blocks (CH343 bridge workaround)
  - file: scripts/west_commands/ssh_provision.py
    commands:
      - name: provision-ssh-key
        class: SshProvision
        help: generate an SSH host key + user keypair and install them
  - file: scripts/west_commands/raptor.py
    commands:
      - name: raptor
        class: Raptor
        help: MCUboot signing keys and hawkBit publishing via raptorctl
