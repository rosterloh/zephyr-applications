build:
  # Module-level Kconfig, sourced into the Zephyr Kconfig tree under
  # Zephyr > Modules. Currently an empty placeholder — per-app symbols live in
  # applications/<app>/Kconfig instead. Path is relative to the repo root.
  kconfig: Kconfig
  # CMakeLists.txt included by the Zephyr build system; `.` is the repo root.
  # Ours only adds a top-level include/ to the include path, if one exists.
  cmake: .
  settings:
    # Makes this repo a board root, so Zephyr discovers boards/<vendor>/<board>/
    # (robotis_openrb_150, adafruit_qt_py_esp32c3). `.` is the repo root.
    # No dts_root here: DT bindings live in the rosterloh-drivers module.
    board_root: .
