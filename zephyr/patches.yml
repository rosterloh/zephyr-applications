# zenoh-pico patches, applied after `west update` by `mise run patch-zenoh`.
# See `west patch --help`.
#
# `west patch clean` reverts only the files listed in checkout-command, so PR
# work in progress inside a module checkout is left alone and will still stop
# the next `west update`. The schema default ("git checkout ." plus
# "git clean -d -f -x") would destroy it, and the generated config.h with it.
#
# One manifest per module: checkout-command is a single string run in every
# module the file names, and `git checkout --` reverts nothing at all if one
# pathspec is unknown to that module. Pico-ROS is in patches-picoros.yml.
#
# include/zenoh-pico/system/platform/zephyr.h, serial/uart_zephyr.c and
# zephyr/CMakeLists.txt are no longer patched, but stay listed so checkouts and
# CI caches carrying the edits of older patches can still be reverted.
checkout-command: >-
  git checkout --
  include/zenoh-pico/system/platform/zephyr.h
  src/link/transport/serial/uart_zephyr.c
  src/link/transport/tcp/tcp_zephyr.c
  src/system/zephyr/system.c
  zephyr/CMakeLists.txt
clean-command: ""

patches:
  - path: zenoh/0001-zephyr-name-zenoh-pthreads.patch
    sha256sum: 1fb079dbedcad148d841b332ad8423de5b1165973aeb4cbf56ced4a7c25f0a65
    # Workspace-relative path, not the module name: zenoh-pico's zephyr/module.yml
    # calls itself "zenoh-pico", and a name that resolves to nothing makes
    # `west patch apply` silently report "0 patches applied successfully".
    module: deps/modules/lib/zenoh
    author: Richard Osterloh
    email: richard.osterloh@gmail.com
    date: 2026-09-21
    upstreamable: true
    issue: https://github.com/eclipse-zenoh/zenoh-pico/pull/1353
    comments: |
      Names the pthreads _z_task_init creates (zenoh0..N) so they stop showing
      up as bare pointers in `kernel thread list` and in the harmless
      "tid %p is in use!" log pthread_attr_destroy() prints on session open.

  - path: zenoh/0002-zephyr-tcp-write-the-whole-buffer.patch
    sha256sum: 6a99e5e8c178de39ba7e9a454377199a3a179ec862f2dff179b0ee1f4766264a
    module: deps/modules/lib/zenoh
    author: Richard Osterloh
    email: richard.osterloh@gmail.com
    date: 2026-09-28
    upstreamable: true
    issue: https://github.com/eclipse-zenoh/zenoh-pico/pull/1351
    comments: |
      _z_tcp_zephyr_write returned Zephyr's short send() count, and a short
      write aborts a stream link after the prefix is already on the wire: the
      router drops the session with "decoding error" and the board reconnects
      into the same wall. Hits ESP32 + WiFi with 128-byte TX net_bufs once the
      Pico-ROS declaration burst fills the send window. Still in 1.10.2.

  - path: zenoh/0003-zephyr-tcp-time-out-reads-with-poll.patch
    sha256sum: 2ff6f943ce76972095b38efda61728f1429e84124a1400b7945461c8c6c35ceb
    module: deps/modules/lib/zenoh
    author: Richard Osterloh
    email: richard.osterloh@gmail.com
    date: 2026-09-28
    upstreamable: true
    issue: https://github.com/eclipse-zenoh/zenoh-pico/pull/1352
    comments: |
      Read and lease share one executor thread, and Zephyr ignores SO_RCVTIMEO
      without CONFIG_NET_CONTEXT_RCVTIMEO, so recv() blocked, no keep-alive went
      out and rmw_zenohd expired the session every 60 s. Polls for
      Z_CONFIG_SOCKET_TIMEOUT before recv() instead. Not RCVTIMEO: on an ESP32
      it stopped the board in early boot (cause unexplained).
