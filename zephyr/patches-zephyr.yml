# Zephyr patches, applied after `west update` via
# `west patch -l zephyr/patches-zephyr.yml apply` (`mise run patch-zephyr`).
# Its own manifest for the checkout-command reason in zephyr/patches.yml.
#
# drivers/input/input_analog_axis.c and dts/bindings/input/analog-axis.yaml are
# no longer patched (upstream 19cd5e04a92), but stay listed so checkouts and CI
# caches carrying the old 0004 edits can still be reverted.
checkout-command: >-
  git checkout --
  subsys/task_wdt/task_wdt.c
  subsys/mgmt/hawkbit/hawkbit.c
  drivers/input/input_analog_axis.c
  dts/bindings/input/analog-axis.yaml
  drivers/video/video_esp32_dvp.c
clean-command: ""

patches:
  - path: zephyr/0001-task_wdt-forget-a-hardware-watchdog-that-rejected-it.patch
    sha256sum: d3714899c894df7aa05be62dbd108009ebe12189936d407dc6f87c1e1c4bee96
    module: deps/zephyr
    author: Richard Osterloh
    email: richard.osterloh@gmail.com
    date: 2026-10-30
    upstreamable: true
    issue: https://github.com/rosterloh/zephyr-applications/issues/123
    comments: |
      A failed wdt_install_timeout() left hw_wdt_dev set, so retrying
      task_wdt_init(NULL) still armed and fed a hardware watchdog with no
      timeout installed. app_watchdog_init() relies on that retry.
  - path: zephyr/0002-mgmt-hawkbit-fix-resuming-from-a-full-or-ignored-ran.patch
    sha256sum: d61bf59abbe92ef17afa118d4ce9090ce46eb4acc6cf177eb990f898bfe44c40
    module: deps/zephyr
    author: Richard Osterloh
    email: richard.osterloh@gmail.com
    date: 2026-10-30
    upstreamable: true
    issue: https://github.com/rosterloh/zephyr-applications/issues/124
    comments: |
      CONFIG_HAWKBIT_SAVE_PROGRESS: progress saved at 100% sent an
      unsatisfiable Range on every later attempt, and a 200 reply to a
      Range request rewrote the slot without erasing it.
  - path: zephyr/0003-mgmt-hawkbit-report-a-reverted-update-as-a-failure.patch
    sha256sum: ff185d57d5e88fded80641c0e050667b9b2c1c853bf87dd8acc124b3069a765b
    module: deps/zephyr
    author: Richard Osterloh
    email: richard.osterloh@gmail.com
    date: 2026-10-30
    upstreamable: true
    issue: https://github.com/rosterloh/zephyr-applications/issues/125
    comments: |
      With HAWKBIT_CONFIRM_IMG_ON_INIT=n and an image MCUboot reverted,
      the old image reported the action as a success.
  - path: zephyr/0005-drivers-video-esp32_dvp-capture-JPEG-frames.patch
    sha256sum: cc5f516d82370a85140a3ecc578ed7ce1e001a9075149e88d028d4c9b5b6c5ad
    module: deps/zephyr
    author: Richard Osterloh
    email: richard.osterloh@gmail.com
    date: 2026-11-08
    upstreamable: true
    comments: |
      The ESP32-S3 LCD_CAM driver could only capture fixed-size frames
      and stopped after the first one; JPEG (OV3660 on the DFRobot DFR1154)
      lost frame headers and data at UXGA.
