manifest:
  self:
    path: .
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: rosterloh
      url-base: https://github.com/rosterloh
    - name: golioth
      url-base: https://github.com/golioth
    - name: eclipse-zenoh
      url-base: https://github.com/eclipse-zenoh

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: main
      west-commands: scripts/west-commands.yml
      import:
        path-prefix: deps
        # Clone only the modules strictly needed by these applications.
        name-allowlist:
          - cmsis_6
          - hal_atmel
          - hal_espressif
          - hal_infineon
          - hal_nordic
          - hal_rpi_pico
          - hal_st
          - hal_stm32
          - libmetal
          - lvgl
          - mbedtls
          - mcuboot
          # esp-hosted-mcu (ESP32-P4-Nano's C6 radio) speaks a nanopb-generated
          # protobuf RPC to the coprocessor; CONFIG_ESP_HOSTED_MCU selects it.
          - nanopb
          - open-amp
          - segger
          - tf-psa-crypto
          - tfm-mcuboot
          - trusted-firmware-m
          - zcbor

    - name: rosterloh-drivers
      repo-path: zephyr-drivers
      remote: rosterloh
      revision: main
      path: deps/modules/lib/rosterloh-drivers

    # golioth and pouch are needed only by rasprover and bluetooth_proxy_device.
    # Disabled until https://github.com/golioth/pouch adds full_name to its
    # board.yml (required by the current Zephyr board schema).
    # - name: golioth
    #   repo-path: golioth-firmware-sdk
    #   remote: golioth
    #   path: deps/modules/lib/golioth-firmware-sdk
    #   revision: main
    #   submodules: true
    #
    # - name: pouch
    #   path: deps/modules/lib/pouch
    #   revision: main
    #   url: https://github.com/golioth/pouch.git

    # Pin to a release tag, not main: zenoh-pico must match the zenoh version
    # of the router it talks to (zenohd + zenoh-plugin-ros2dds on the host).
    # Bump this in lockstep with the host's zenohd, then re-run patch-zenoh.
    - name: zenoh
      repo-path: zenoh-pico
      remote: eclipse-zenoh
      revision: 1.10.1
      path: deps/modules/lib/zenoh

    # pstop_c: the Apache-2.0 protective-stop protocol library. Pinned to a
    # SHA, not a branch: this is safety-relevant code and a change to the
    # state machine must be a deliberate, reviewed bump.
    #
    # TEMPORARILY sourced from our fork. The pinned commit is upstream's
    # 4ce8094 plus two changes, each open as its own upstream PR:
    #
    #   #121  zephyr/module.yml + Kconfig + CMakeLists, so pstop_c builds as
    #         a Zephyr module. applications/protective_stop selects
    #         CONFIG_PSTOP, which does not exist upstream yet.
    #   #129  endian.c reads and writes little-endian fields byte-wise.
    #         Upstream casts a uint8_t* at an unaligned offset to
    #         uint32_t*/uint64_t* -- every multi-byte field in the 48-byte
    #         frame is unaligned, so decoding faults on any target that traps
    #         it. x86 and Xtensa absorb it; Cortex-M3 does not, which is what
    #         blocks running the unit suites on macOS via qemu_cortex_m3.
    #
    # They touch disjoint trees (#121 only zephyr/, #129 only pstop_c/) and
    # the fork's zephyr-integration branch carries both. Point this back at
    # polymathrobotics and bump to the merge commit once they land; nothing
    # in the application changes.
    - name: protective-stop
      url: https://github.com/rosterloh/protective-stop.git
      revision: b6020db7993a5b0e5abfc834072451ebf0113bac
      path: deps/modules/lib/protective-stop
