# Application
CONFIG_MAIN_STACK_SIZE=2560
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_SHELL=y
CONFIG_REBOOT=y
CONFIG_LOG=y

# Networking: Ethernet (RMII EMAC) + DHCPv4
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_ESP32=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

# Camera: IMX219 over MIPI CSI-2. Frames are large RAW10 (~2.5 MB at
# 1640x1232), so video buffers are drawn from PSRAM via the shared multi-heap
# (SMH attribute 2 = external) and aligned to the 64-byte D-cache line.
CONFIG_VIDEO=y
CONFIG_VIDEO_ESP32_CSI=y
# Use the workspace's forked IMX219 driver, not Zephyr's in-tree one: the
# in-tree PLL table makes the sensor transmit at ~400 Mbps/lane while
# advertising a 456 MHz (912 Mbps) link frequency. Both bind "sony,imx219", so
# the in-tree one must be turned off explicitly.
CONFIG_VIDEO_IMX219=n
CONFIG_VIDEO_IMX219_OOT=y
CONFIG_VIDEO_SHELL=y
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=6291456

# MCUmgr: SMP over UDP for remote OS management (reboot / echo / taskstat) and
# image upgrade. The image group needs the MCUboot bootloader, so this app must
# be built with --sysbuild; a plain build still compiles and runs but has no
# upgrade path. CONFIG_BOOTLOADER_MCUBOOT is not set here - sysbuild propagates
# it to this image from SB_CONFIG_BOOTLOADER_MCUBOOT.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y

# Image upgrade: slot management for the MCUmgr image group.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y

# Stall detection. The app is event driven -- main() returns after bringing the
# network and camera up -- so there is no superloop to feed a long-lived
# channel from. Coverage is instead a channel around each bounded operation
# that can wedge: boot, and every capture. See applications/common/watchdog/.
#
# Both supported boards alias the TIMG MWDT as watchdog0, so TASK_WDT_HW_FALLBACK
# has real hardware behind it: the kernel timer catches a stalled task, and the
# SoC resets even if the kernel itself stops running. That second case is the
# one that matters here -- rosterloh/zephyr-drivers#43 has the CSI receiver
# taking the whole system quiet, with no ISR, workqueue or log processor left.
CONFIG_APP_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y

# Coredump on the console. A fault dumps automatically; a watchdog timeout
# dumps from its handler before rebooting, so a silent stall leaves the same
# evidence a fault would.
#
# Backend: LOGGING, not LOGGING_UDP. UDP would suit a headless box, but it
# needs a peer address baked in at build time (DEBUG_COREDUMP_LOGGING_UDP_HOST)
# which cannot be committed, and it cannot run from the watchdog handler --
# that is ISR context and the network stack is not reachable from there. The
# logging backend enters panic mode and writes from a static buffer, which is.
# Pass -DCONFIG_DEBUG_COREDUMP_BACKEND_LOGGING_UDP=y plus the host for a
# one-off headless capture of a *fault* (not a stall).
#
# MEMORY_DUMP_MIN, not the LINKER_RAM default: the dump is hex over a 115200
# console, and this board's RAM region would take minutes. MIN carries the
# faulting stack, which is what a backtrace needs for the fault case. Chasing a
# *stall* wants CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y instead -- every
# thread's stack, so the wedged one is visible -- at the cost of dump time.
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
