# Application
CONFIG_MAIN_STACK_SIZE=2560
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_SHELL=y
CONFIG_REBOOT=y
CONFIG_LOG=y

# Networking: Ethernet (RMII EMAC) + DHCPv4
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_ESP32=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

# Camera: IMX219 over MIPI CSI-2. Frames are large RAW10 (~2.5 MB at
# 1640x1232), so video buffers are drawn from PSRAM via the shared multi-heap
# (SMH attribute 2 = external) and aligned to the 64-byte D-cache line.
CONFIG_VIDEO=y
CONFIG_VIDEO_ESP32_CSI=y
CONFIG_VIDEO_SHELL=y
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=6291456

# MCUmgr: SMP over UDP for remote OS management (reboot / echo / taskstat) and
# image upgrade. The image group needs the MCUboot bootloader, so this app must
# be built with --sysbuild; a plain build still compiles and runs but has no
# upgrade path. CONFIG_BOOTLOADER_MCUBOOT is not set here - sysbuild propagates
# it to this image from SB_CONFIG_BOOTLOADER_MCUBOOT.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y

# Image upgrade: slot management for the MCUmgr image group.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
