# Revert-capable OTA.
#
# This must be set explicitly. soc/espressif/Kconfig.sysbuild overrides the
# generic sysbuild default with "default MCUBOOT_MODE_OVERWRITE_ONLY if
# SOC_FAMILY_ESPRESSIF_ESP32", so every ESP32-family board silently gets
# overwrite-only, where the uploaded image replaces slot0 permanently and
# "mcumgr image test" is indistinguishable from "image confirm". A bad image
# then bricks the board until someone reflashes it over USB - unacceptable for
# a device whose whole point is being managed over the network.
#
# swap-using-move keeps the running image in slot1, so an image that is marked
# test-only and never confirmed is reverted by MCUboot on the next reset. It
# needs no scratch partition.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
