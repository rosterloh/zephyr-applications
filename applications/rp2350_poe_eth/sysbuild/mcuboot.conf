# MCUboot configuration for the Waveshare RP2350-POE-ETH.
#
# Image signing: none for development. Switch to
# CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256 before production and generate a key
# pair with `west sign --tool imgtool --key <key.pem>`.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Keep the bootloader quiet so it does not interleave with the app console.
CONFIG_BOOT_BANNER=n
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=2048
