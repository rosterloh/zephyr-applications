# Logging
CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_INF=y
CONFIG_LOG_BUFFER_SIZE=4096

# hawkBit needs a full libc (it uses strtol/snprintf on 64-bit types).
CONFIG_REQUIRES_FULL_LIBC=y

# --- Networking -------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_CONFIG_SETTINGS=n

# The W6300 is a hardwired TCP/IP part but Zephyr drives it as a plain MAC,
# so the usual buffer counts apply.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

CONFIG_HTTP_CLIENT=y
CONFIG_JSON_LIBRARY=y

# --- Flash / DFU ------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y

CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_REBOOT=y
CONFIG_HWINFO=y

# --- hawkBit ----------------------------------------------------------------
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_HAWKBIT=y
CONFIG_HAWKBIT_AUTOHANDLER=y
CONFIG_HAWKBIT_POLL_INTERVAL=5
CONFIG_HAWKBIT_EVENT_CALLBACKS=y
# Mark the running image good once it has talked to the server, so MCUboot
# does not revert it on the next boot.
CONFIG_HAWKBIT_CONFIRM_IMG_ON_INIT=y

# Point these at your hawkBit instance, or set them at runtime from the shell
# (`hawkbit set addr <ip>` / `hawkbit set port <port>`).
CONFIG_HAWKBIT_SERVER="192.168.1.110"
CONFIG_HAWKBIT_PORT=8080
CONFIG_HAWKBIT_DDI_GATEWAY_SECURITY=y
CONFIG_HAWKBIT_DDI_SECURITY_TOKEN="abcd1234"

# --- Shell ------------------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_HAWKBIT_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_FLASH_SHELL=y

# --- Stacks / heap ----------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

CONFIG_BUILD_OUTPUT_HEX=y
