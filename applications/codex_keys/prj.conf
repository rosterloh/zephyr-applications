# Application
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_REBOOT=y

# 3x NeoKey 1x4 + rotary encoder: seesaw MFD stack over the STEMMA QT I2C bus
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_MFD=y
CONFIG_MFD_ADAFRUIT_SEESAW=y
CONFIG_GPIO_ADAFRUIT_SEESAW=y
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_ADAFRUIT_SEESAW=y
CONFIG_SENSOR=y
CONFIG_ADAFRUIT_SEESAW_ENCODER=y

# Bluetooth HID-over-GATT peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="Codex Micro"
CONFIG_BT_DEVICE_APPEARANCE=960
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BAS=y
# esp32 BLE host RX thread needs more than the 1200-byte default (zephyr#114394)
CONFIG_BT_RX_STACK_SIZE=2048

# Identity ChatGPT Desktop probes for. Not ours: these belong to the Work Louder
# Codex Micro keyboard and are emitted only for host compatibility detection.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="Codex Micro"
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Work Louder"
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x303A
CONFIG_BT_DIS_PNP_PID=0x8360
CONFIG_BT_DIS_PNP_VER=0x0101

# 63-byte reports need an ATT MTU of at least 66
CONFIG_BT_L2CAP_TX_MTU=252
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Persistent storage for bonds
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
