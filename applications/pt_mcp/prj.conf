# Application
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SHELL=y
CONFIG_REBOOT=y

# Logging
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Pan/tilt: UART bus servos exposed as actuators
CONFIG_ACTUATOR=y
CONFIG_BUS_SERVO=y
CONFIG_ACTUATOR_BUS_SERVO=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Flash and Settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# Firmware upgrade (MCUboot OTA receiver)
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# MCUmgr: SMP over UDP for OTA image upload and OS management
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_UDP=y

# MCP Server library
CONFIG_MCP_SERVER=y
CONFIG_MCP_MAX_TOOLS=2
CONFIG_MCP_REQUEST_WORKERS=2
CONFIG_MCP_SERVER_INFO_TITLE=y
CONFIG_MCP_TOOL_DESC=y
CONFIG_MCP_TOOL_TITLE=y

# MCP HTTP transport
CONFIG_MCP_HTTP_LOG_ADDRESS=y
CONFIG_MCP_HTTP_PORT=8080
CONFIG_MCP_HTTP_ENDPOINT="/mcp"
CONFIG_HTTP_SERVER_MAX_CLIENTS=3
CONFIG_HTTP_SERVER_MAX_STREAMS=3
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=38

# mDNS
CONFIG_MDNS_RESPONDER=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="pt-mcp"

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_WIFI=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_STA_AUTO_DHCPV4=y

# WiFi connection management: conn_mgr + the CONNECTIVITY_WIFI_MGMT
# implementation from the rosterloh-drivers module. Auto-connects at boot
# using stored credentials; provision with: wifi cred add -s <ssid> -k 1 -p <psk>
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_CONNECTIVITY_WIFI_MGMT=y
CONFIG_WIFI_CONNECTIVITY=y
