# Frames in PSRAM
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2
CONFIG_ESP_SPIRAM=y
# DRAM is the tight resource on the ESP32 (mbedTLS heap + DMA ring + WiFi):
# put the WiFi adapter heap and net buffers in PSRAM.
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
# Two UXGA JPEG buffers (2 x 384 KB) plus the WiFi heap.
CONFIG_ESP_SPIRAM_HEAP_SIZE=2097152
CONFIG_LED_PWM=y

# WiFi station
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_SHELL=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SHELL=y
CONFIG_DNS_RESOLVER=y
# <hostname>.local, plus an _http._tcp record for the config page
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
# HTTP server (listen + 2 clients), stream (listen + 1), TLS upload, DNS, mDNS
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10
# app_wifi starts DHCP itself, or sets the static address instead.
CONFIG_WIFI_STA_AUTO_DHCPV4=n

# The ESP32 linker script puts .mbedtls_heap in PSRAM (ext_ram.bss).
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y

# The task watchdog's hardware fallback is the TIMG watchdog (watchdog0).
CONFIG_TASK_WDT_HW_FALLBACK=y

# Coredump to the 4 KB `coredump` flash partition, read back over the shell with
# `coredump find`, `coredump print` and `coredump erase`. The partition cannot
# hold RAM, so keep the faulting thread's registers and top 2 KB of stack; the
# default limit is unbounded.
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
CONFIG_DEBUG_COREDUMP_SHELL=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_DEBUG_COREDUMP_THREAD_STACK_TOP_LIMIT_FOR_CURRENT=2048

# hawkBit OTA into MCUboot slot1. Build with --sysbuild (sysbuild.conf).
#
# A new image boots on trial and is confirmed once it has an IPv4 address and
# a frame from the camera (applications/common/img_confirm); otherwise the task
# watchdog resets it and MCUboot reverts. The autohandler only runs on a
# confirmed image, which is why HAWKBIT_CONFIRM_IMG_ON_INIT is off.
#
# Server, port and DDI token are set at runtime (`hawkbit set addr|port|
# ddi_token`) and kept in settings; the server may be a host name.
CONFIG_REBOOT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_HAWKBIT=y
CONFIG_HAWKBIT_CONFIRM_IMG_ON_INIT=n
CONFIG_HAWKBIT_SET_SETTINGS_RUNTIME=y
CONFIG_HAWKBIT_USE_DOMAIN_NAME=y
CONFIG_HAWKBIT_SHELL=y
CONFIG_HAWKBIT_DDI_TARGET_SECURITY=y
CONFIG_HAWKBIT_HWINFO_DEVICE_ID=y
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
# Resume an interrupted download (HTTP Range); progress saved every 5 %.
CONFIG_HAWKBIT_SAVE_PROGRESS=y
CONFIG_HAWKBIT_SAVE_PROGRESS_INTERVAL=5
CONFIG_STREAM_FLASH_PROGRESS=y
