<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prusa Connect camera</title>
<style>
body{font-family:system-ui,sans-serif;max-width:40rem;margin:1rem auto;padding:0 1rem}
img{width:100%;background:#ddd;min-height:8rem}
label{display:block;margin:.5rem 0}
input:not([type=checkbox]),select{width:100%;box-sizing:border-box;padding:.3rem}
#msg{min-height:1.2rem}
</style>
</head>
<body>
<h1>Prusa Connect camera</h1>
<img id="snap" alt="Latest snapshot">
<p><button id="refresh" type="button">Refresh snapshot</button>
<a id="stream" href="#">Live stream</a></p>
<p id="status"></p>
<p><button id="test" type="button">Test connection</button></p>
<form id="cfg">
<label>Camera name in Prusa Connect
<input name="name" maxlength="32" required></label>
<label>Prusa Connect token (20 letters/digits; leave empty to keep)
<input name="token" autocomplete="off" pattern="[A-Za-z0-9]{20}" maxlength="20"></label>
<label>Upload every
<select name="interval">
<option value="10">10 s</option><option value="30">30 s</option>
<option value="60">60 s</option><option value="600">10 min</option>
</select></label>
<label>Resolution
<select name="resolution">
<option>QVGA</option><option>VGA</option><option>SVGA</option>
<option>XGA</option><option>SXGA</option><option>UXGA</option>
</select></label>
<label>JPEG quality (5&ndash;100)
<input name="quality" type="number" min="5" max="100"></label>
<label><input name="hflip" type="checkbox"> Mirror</label>
<label><input name="vflip" type="checkbox"> Flip</label>
<label><input name="flash" type="checkbox"> Flash LED during capture</label>
<label>Rotation (camera as mounted)
<select name="rotation">
<option value="0">0&deg;</option><option value="90">90&deg;</option>
<option value="180">180&deg;</option><option value="270">270&deg;</option>
</select></label>
<fieldset><legend>Image</legend>
<label>Brightness <input name="brightness" type="range" min="-2" max="2"></label>
<label>Contrast <input name="contrast" type="range" min="-2" max="2"></label>
<label>Saturation <input name="saturation" type="range" min="-2" max="2"></label>
<label><input name="auto_exposure" type="checkbox"> Auto exposure</label>
<label><input name="auto_wb" type="checkbox"> Auto white balance</label>
<label><input name="auto_gain" type="checkbox"> Auto gain</label>
</fieldset>
<fieldset><legend>Static IPv4 (leave address empty for DHCP; applies on reconnect)</legend>
<label>Address <input name="ip" inputmode="decimal"></label>
<label>Netmask <input name="netmask" inputmode="decimal"></label>
<label>Gateway <input name="gateway" inputmode="decimal"></label>
<label>DNS (empty: gateway) <input name="dns" inputmode="decimal"></label>
</fieldset>
<label>New admin password (leave empty to keep)
<input name="password" type="password" autocomplete="new-password" maxlength="32"></label>
<button type="submit">Save</button>
</form>
<p id="msg" role="status"></p>
<p><small>Fingerprint: <span id="fp"></span></small></p>
<script>
const f = document.getElementById('cfg');
const msg = t => document.getElementById('msg').textContent = t;
const text = ['name', 'interval', 'resolution', 'quality', 'rotation', 'brightness', 'contrast',
	'saturation', 'ip', 'netmask', 'gateway', 'dns'];
const num = ['interval', 'quality', 'rotation', 'brightness', 'contrast', 'saturation'];
const bool = ['hflip', 'vflip', 'flash', 'auto_exposure', 'auto_wb', 'auto_gain'];
function snap() { document.getElementById('snap').src = '/snapshot.jpg?' + Date.now(); }
function show(c) {
	for (const k of text) f[k].value = c[k];
	for (const k of bool) f[k].checked = c[k];
	f.token.placeholder = c.token_set ? 'set' : 'not set';
	document.getElementById('fp').textContent = c.fingerprint;
}
async function status() {
	const s = await (await fetch('/api/status')).json();
	document.getElementById('status').textContent = `Uploads: ${s.uploads}, last result: ` +
		(s.result ? `${s.last_result} (${s.result})` : 'none yet') +
		(s.stopped ? '. Stopped until the settings change.' : '');
}
async function load() {
	const r = await fetch('/api/config');
	const c = await r.json();
	if (!r.ok) { msg(c.error); return; }
	show(c);
	status();
	snap();
}
f.onsubmit = async e => {
	e.preventDefault();
	const c = {};
	for (const k of text) c[k] = num.includes(k) ? +f[k].value : f[k].value;
	for (const k of bool) c[k] = f[k].checked;
	if (f.token.value) c.token = f.token.value;
	if (f.password.value) c.password = f.password.value;
	const r = await fetch('/api/config', {method: 'POST', body: JSON.stringify(c)});
	const j = await r.json();
	if (r.ok) { show(j); f.token.value = ''; f.password.value = ''; msg('Saved'); status(); }
	else msg(j.error);
};
document.getElementById('test').onclick = async () => {
	await fetch('/api/test', {method: 'POST'});
	msg('Testing...');
	setTimeout(() => { status(); msg(''); }, 5000);
};
document.getElementById('refresh').onclick = snap;
document.getElementById('stream').href = `http://${location.hostname}:81/stream`;
load();
</script>
</body>
</html>
