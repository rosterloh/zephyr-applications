<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prusa camera</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--fg:#18181b;--mute:#71717a;--line:#e4e4e7;--acc:#ea580c;--ok:#16a34a;--bad:#dc2626;--term:#0c0c0e}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f12;--card:#18181c;--fg:#ececf0;--mute:#9a9aa5;--line:#2a2a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:1}
header h1{font-size:1.05rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px #16a34a33}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px #dc262633}
main{max-width:64rem;margin:0 auto;padding:1rem;display:grid;gap:1rem;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:48rem){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:1rem}
.wide{grid-column:1/-1}
.snap{position:relative;padding:0;overflow:hidden}
.snap img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#000}
.bar{position:absolute;left:.5rem;bottom:.5rem;display:flex;gap:.4rem}
.bar>*{background:#000a;color:#fff;border:0;border-radius:.4rem;padding:.35rem .7rem;font:inherit;font-size:.85rem;text-decoration:none;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:0}
.stats div{border:1px solid var(--line);border-radius:.5rem;padding:.5rem .65rem}
.stats dt{font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.stats dd{margin:0;font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats .full{grid-column:1/-1}
button{font:inherit;border-radius:.5rem;border:1px solid var(--line);background:transparent;color:inherit;padding:.45rem .9rem;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin:-1rem -1rem 1rem;padding:0 .5rem;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:.75rem .8rem;color:var(--mute)}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--acc)}
[role=tabpanel]{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr))}
[hidden]{display:none!important}
label{display:grid;gap:.25rem;font-size:.85rem;color:var(--mute)}
label.chk{display:flex;align-items:center;gap:.5rem;color:var(--fg);font-size:.95rem}
input:not([type=checkbox]),select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:.45rem;padding:.4rem .55rem;width:100%}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:1.05rem;height:1.05rem}
.foot{display:flex;align-items:center;gap:1rem;margin-top:1rem;flex-wrap:wrap}
#msg{flex:1;color:var(--mute)}
.mono,#out,#cmd{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
#term{grid-template-columns:1fr}
#out{background:var(--term);color:#d4d4d8;margin:0;height:22rem;overflow:auto;padding:.75rem;border-radius:.5rem;white-space:pre-wrap;word-break:break-all}
.in{display:flex;align-items:center;gap:.5rem;background:var(--term);border-radius:.5rem;padding:.35rem .75rem;color:var(--acc)}
#cmd{background:transparent;border:0;color:#fff;outline:0;padding:.2rem 0}
</style>
</head>
<body>
<header><span id="dot" class="dot"></span><h1 id="title">Prusa camera</h1><span id="up" class="mono"></span></header>
<main>
<section class="card snap"><img id="snap" alt="Latest snapshot">
<div class="bar"><button id="refresh" type="button">Refresh</button><a id="stream" href="#">Live</a></div></section>
<section class="card"><dl class="stats">
<div><dt>Uploads</dt><dd id="uploads">-</dd></div>
<div><dt>Last upload</dt><dd id="ago">-</dd></div>
<div class="full"><dt>Prusa Connect</dt><dd id="result">-</dd></div>
<div class="full"><dt>Fingerprint</dt><dd id="fp" class="mono">-</dd></div>
</dl><div class="foot"><button id="test" type="button">Test connection</button></div></section>
<section class="card wide">
<div class="tabs" role="tablist"><button role="tab" aria-selected="true">Camera</button><button role="tab">Image</button><button role="tab">Network</button><button role="tab">Security</button><button role="tab">Terminal</button></div>
<form id="cfg">
<div role="tabpanel">
<label>Name in Prusa Connect<input name="name" maxlength="32" required></label>
<label>Token (empty keeps it)<input name="token" autocomplete="off" pattern="[A-Za-z0-9]{20}" maxlength="20"></label>
<label>Upload every<select name="interval"><option value="10">10 s</option><option value="30">30 s</option><option value="60">60 s</option><option value="600">10 min</option></select></label>
<label>Resolution<select name="resolution"></select></label>
<label>JPEG quality (5-100)<input name="quality" type="number" min="5" max="100"></label>
<label>Rotation (as mounted)<select name="rotation"><option value="0">0&deg;</option><option value="90">90&deg;</option><option value="180">180&deg;</option><option value="270">270&deg;</option></select></label>
<label class="chk"><input name="hflip" type="checkbox">Mirror</label>
<label class="chk"><input name="vflip" type="checkbox">Flip</label>
<label class="chk"><input name="flash" type="checkbox">Flash LED during capture</label>
</div>
<div role="tabpanel" hidden>
<label>Brightness<input name="brightness" type="range" min="-2" max="2"></label>
<label>Contrast<input name="contrast" type="range" min="-2" max="2"></label>
<label>Saturation<input name="saturation" type="range" min="-2" max="2"></label>
<label class="chk"><input name="auto_exposure" type="checkbox">Auto exposure</label>
<label class="chk"><input name="auto_wb" type="checkbox">Auto white balance</label>
<label class="chk"><input name="auto_gain" type="checkbox">Auto gain</label>
</div>
<div role="tabpanel" hidden>
<label>Static address (empty: DHCP)<input name="ip" inputmode="decimal"></label>
<label>Netmask<input name="netmask" inputmode="decimal"></label>
<label>Gateway<input name="gateway" inputmode="decimal"></label>
<label>DNS (empty: gateway)<input name="dns" inputmode="decimal"></label>
</div>
<div role="tabpanel" hidden>
<label>Home Assistant key (base64, empty keeps it)<input name="ha_key" type="password" autocomplete="off" maxlength="44"></label>
<label>New admin password (empty keeps it)<input name="password" type="password" autocomplete="new-password" maxlength="32"></label>
</div>
<div class="foot" id="save"><span id="msg" role="status"></span><button class="pri" type="submit">Save</button></div>
</form>
<div role="tabpanel" id="term" hidden>
<pre id="out" aria-live="polite"></pre>
<div class="in"><span class="mono">$</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Shell command"></div>
</div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const f = $('cfg');
const msg = t => $('msg').textContent = t;
const text = ['name', 'interval', 'resolution', 'quality', 'rotation', 'brightness', 'contrast',
	'saturation', 'ip', 'netmask', 'gateway', 'dns'];
const num = ['interval', 'quality', 'rotation', 'brightness', 'contrast', 'saturation'];
const bool = ['hflip', 'vflip', 'flash', 'auto_exposure', 'auto_wb', 'auto_gain'];
const dur = s => s < 90 ? `${s} s` : s < 5400 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`;
function snap() { $('snap').src = '/snapshot.jpg?' + Date.now(); }
function show(c) {
	f.resolution.replaceChildren(...c.resolutions.map(r => new Option(r)));
	for (const k of text) f[k].value = c[k];
	for (const k of bool) f[k].checked = c[k];
	f.token.placeholder = c.token_set ? 'set' : 'not set';
	$('fp').textContent = c.fingerprint;
	$('title').textContent = c.name;
}
async function status() {
	const s = await (await fetch('/api/status')).json();
	$('up').textContent = 'up ' + dur(s.uptime_s);
	$('uploads').textContent = s.uploads;
	$('ago').textContent = s.last_upload_s ? dur(s.uptime_s - s.last_upload_s) + ' ago' : 'never';
	$('result').textContent = s.stopped ? 'Stopped until the settings change' :
		s.result ? `${s.last_result} ${s.result}` : 'No upload yet';
	$('dot').className = 'dot ' + (s.stopped || (s.result && s.last_result >= 300) ? 'bad' : s.result ? 'ok' : '');
}
async function load() {
	const r = await fetch('/api/config');
	const c = await r.json();
	if (!r.ok) { msg(c.error); return; }
	show(c);
	status();
	setInterval(status, 10000);
	snap();
}
f.onsubmit = async e => {
	e.preventDefault();
	const c = {};
	for (const k of text) c[k] = num.includes(k) ? +f[k].value : f[k].value;
	for (const k of bool) c[k] = f[k].checked;
	if (f.token.value) c.token = f.token.value;
	if (f.password.value) c.password = f.password.value;
	if (f.ha_key.value) c.ha_key = f.ha_key.value;
	const r = await fetch('/api/config', {method: 'POST', body: JSON.stringify(c)});
	const j = await r.json();
	if (r.ok) { show(j); f.token.value = ''; f.password.value = ''; f.ha_key.value = ''; msg('Saved'); status(); }
	else msg(j.error);
};
$('test').onclick = async () => {
	await fetch('/api/test', {method: 'POST'});
	$('result').textContent = 'Testing...';
	setTimeout(status, 5000);
};
$('refresh').onclick = snap;
$('stream').href = `http://${location.hostname}:81/stream`;

/* Line-mode terminal: the shell's echo and VT100 are off, so output is plain text. */
let ws, hist = [], hi = 0;
const out = $('out'), cmd = $('cmd');
const put = t => { out.textContent += t; out.scrollTop = out.scrollHeight; };
function term() {
	if (ws && ws.readyState < 2) return;
	ws = new WebSocket(`ws://${location.host}/shell`);
	ws.onopen = () => ws.send('shell echo off\nshell colors off\nshell vt100 off\n');
	ws.onmessage = e => put(e.data.replace(/\r/g, ''));
	ws.onclose = () => put('\n[disconnected]\n');
}
cmd.onkeydown = e => {
	if (e.key === 'Enter' && ws && ws.readyState === 1) {
		hist.push(cmd.value); hi = hist.length;
		put('$ ' + cmd.value + '\n'); ws.send(cmd.value + '\n'); cmd.value = '';
	} else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
		hi = Math.max(0, Math.min(hist.length, hi + (e.key === 'ArrowUp' ? -1 : 1)));
		cmd.value = hist[hi] || ''; e.preventDefault();
	}
};
const tabs = [...document.querySelectorAll('[role=tab]')];
const panels = [...document.querySelectorAll('[role=tabpanel]')];
tabs.forEach((t, i) => t.onclick = () => {
	tabs.forEach((u, j) => u.setAttribute('aria-selected', i === j));
	panels.forEach((p, j) => p.hidden = i !== j);
	$('save').hidden = i === 4;
	if (i === 4) { term(); cmd.focus(); }
});
load();
</script>
</body>
</html>
