# Host-backed BSD sockets: the HTTP server, the MJPEG stream and the uploads
# use the host's loopback directly, with no TAP interface and no root.
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_NATIVE=n

# ZMS on flash_simulator, persisted to a host file.
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y

CONFIG_GPIO=y
CONFIG_PSA_CRYPTO=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=4
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
# Sockets come from the fd table; NET_MAX_CONTEXTS sizes it on hardware.
CONFIG_ZVFS_OPEN_MAX=18
