# The DVP DMA writes a frame straight into its buffer: the largest in
# cfg_resolutions, an FHD JPEG buffer (1920 x 1080 / 5 B), takes 103
# descriptors of 4032 B.
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=104
# The GDMA stalls writing to PSRAM at less than 64-byte alignment.
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64
