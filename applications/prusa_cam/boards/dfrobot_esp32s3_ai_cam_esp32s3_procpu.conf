# The DVP DMA writes a frame straight into its buffer: a UXGA JPEG buffer
# (1600 x 1200 / 5 B) takes 96 descriptors of 4032 B.
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=100
# The GDMA stalls writing to PSRAM at less than 64-byte alignment.
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64

# Shell in the web page (/shell, same login as the API); about 8 KB of DRAM.
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_SHELL_BACKEND_WEBSOCKET=y
