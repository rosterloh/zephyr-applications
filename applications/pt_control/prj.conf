# Application
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SHELL=y
CONFIG_REBOOT=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Shell over telnet (TCP port 23) in addition to the UART console.
# The net socket-service thread polls one array across ALL socket services
# (SMP-UDP + SNTP + telnet's 3 fds + its eventfd); the default ZVFS_POLL_MAX=4
# overflows once telnet is added, failing the thread ("register socket
# service, -5"). Raise it to cover every service.
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_ZVFS_POLL_MAX=10

# Flash and Settings (WiFi credentials are stored via the settings backend)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# Firmware upgrade (MCUboot OTA receiver). Build with --sysbuild to produce a
# bootable, OTA-capable image (see sysbuild.conf).
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# MCUmgr: SMP over UDP for wireless OTA image upload and OS management.
# Upload with: mcumgr --conntype udp --connstring <ip>:1337 image upload ...
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_UDP=y

# Pan/tilt gimbal: UART bus servos exposed as actuators
CONFIG_ACTUATOR=y
CONFIG_ACTUATOR_SHELL=y
CONFIG_ACTUATOR_BUS_SERVO=y
CONFIG_BUS_SERVO=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# zenoh-pico: publish JointState / subscribe joint commands over WiFi TCP
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
# CDR codec (rosterloh-drivers) for encoding ROS 2 rmw payloads
CONFIG_CDR=y
CONFIG_POSIX_API=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y
CONFIG_APP_TIME_SYNC=y
# zenoh-pico uses malloc (libc heap), not k_heap
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Status OLED (SSD1306 128x32 on i2c0) showing WiFi/IP via the Character Frame
# Buffer. CFB, not LVGL: LVGL's monochrome init/render path hangs this panel at
# boot, and CFB is far simpler for a two-line text readout.
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
# Use only the app's 8x8 unscii font (src/cfb_font_unscii8.c): 3 rows on the
# 128x32 panel and a full IP on one line. The stock 10x16/15x24/20x32 fonts
# are too large (2 rows, IP doesn't fit), so drop them to save flash.
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
CONFIG_APP_DISPLAY=y

# Networking
CONFIG_NETWORKING=y
# ESP32 WiFi driver: registers the STA interface. Without this only the WiFi
# management/shell layers exist and the shell reports "No default interface
# found for type: STA". WIFI_ESP32 then auto-enables (needs hal_espressif blobs).
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_DHCPV4=y

# WiFi connection management: conn_mgr + stored credentials, with the
# CONNECTIVITY_WIFI_MGMT implementation from the rosterloh-drivers module.
# Provision over the shell: wifi cred add -s <ssid> -k 1 -p <psk>
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_CONNECTIVITY_WIFI_MGMT=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CONNECTIVITY=y
CONFIG_NET_L2_WIFI_SHELL=y
