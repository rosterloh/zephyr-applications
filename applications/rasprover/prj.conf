# Application
# 4096, not 3072: picoros_{node,publisher,subscriber}_declare() each build an
# rmw_zenoh key expression in a 400-byte stack buffer (KEYEXPR_SIZE), and the
# liveliness variant adds a 124-byte mangled-topic buffer on top, all from
# main() via app_picoros_init().
#
# This costs 5 KB of DRAM, not 1 KB. zenoh-pico's Zephyr platform layer sizes
# its pool of preallocated pthread stacks at CONFIG_MAIN_STACK_SIZE
# (Z_PTHREAD_STACK_SIZE_DEFAULT in src/system/zephyr/system.c), so raising main
# raises all CONFIG_ZENOH_PICO_THREADS_NUM (4) of them too:
# thread_stack_area grows 12 KB -> 16 KB. CONFIG_ZENOH_PICO_THREADS_NUM=2 below
# claws that back.
CONFIG_MAIN_STACK_SIZE=4096
# The WiFi reconnect path (wifi_connectivity's retry -> NET_REQUEST_WIFI_CONNECT_STORED
# -> esp32_wifi_connect) runs here and peaked at 1888 B measured. sys_work_q_stack
# sits directly above z_main_stack, so an overflow does not fault: it overwrites
# main's saved context while main blocks in app_net_connect(), and the board dies
# later in z_swap. 3072 keeps a third spare.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_SHELL=y
CONFIG_REBOOT=y

# Logging. Without CONFIG_LOG every LOG_* in the app compiles out. Immediate
# mode to the UART: the deferred-mode image failed to boot on this board
# ("Failed to init flash chip" before main); not yet understood.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y

# Flash and Settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# Firmware upgrade (MCUboot OTA receiver)
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# MCUmgr: SMP protocol for OTA image upload and OS management
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# SMP over shell UART (shares existing console - use mcumgr CLI or nRF Connect)
CONFIG_BASE64=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y

# No Bluetooth (so no SMP over BT): its 25 KB heap reservation plus the OLED's
# LVGL stack do not fit alongside WiFi -- dram0 overflowed by 71.5 KB with all
# three. OTA goes over the shell UART.

# Pico-ROS: appear on the host ROS 2 graph as an rmw_zenoh node over WiFi TCP.
# CONFIG_APP_PICOROS selects CONFIG_PICOROS, which pulls in zenoh-pico with
# publication, subscription and multi-threading; only the link type is left to
# the application. It also selects ZENOH_PICO_QUERY and ZENOH_PICO_QUERYABLE,
# because picoros.c does not compile without them -- see CONFIG_PICOROS_SERVICES.
CONFIG_APP_PICOROS=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y
CONFIG_APP_TIME_SYNC=y
# Only the read and lease tasks are ever started, and each slot costs a
# CONFIG_MAIN_STACK_SIZE stack.
CONFIG_ZENOH_PICO_THREADS_NUM=2
# zenoh-pico's z_malloc() is k_malloc(): the *system* heap, shared with the
# ESP32 WiFi driver. Zephyr sizes that heap as max(this, sum of the
# HEAP_MEM_POOL_ADD_SIZE_* reservations ~= 56 KB, mostly WiFi), so a value below
# 56 KB changes nothing. Measured: 32.6 KB in use before the session opens,
# 50.3 KB after, 56.5 KB peak. Too small shows up as "esp32_wifi_adapter: memory
# allocation failed" and failed zenoh declarations.
CONFIG_HEAP_MEM_POOL_SIZE=73728
# The default pools of 5 are exhausted by a multi-threaded zenoh session: it
# fails with ENOMEM right after the OPEN handshake with the router succeeds.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=32
CONFIG_MAX_PTHREAD_COND_COUNT=16

# Drivers
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SENSOR=y

# Motors: h-bridge actuators + PCNT encoders
CONFIG_ACTUATOR=y
CONFIG_ACTUATOR_HBRIDGE=y
CONFIG_ACTUATOR_HBRIDGE_ENCODER=y
CONFIG_PWM=y

# Gimbal: UART bus servos exposed as actuators
CONFIG_BUS_SERVO=y
CONFIG_ACTUATOR_BUS_SERVO=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_APP_GIMBAL=y

# OLED Display: off on hardware (see Bluetooth above for why); native_sim
# turns it back on for the SDL display.
CONFIG_APP_DISPLAY=n

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_DHCPV4=y
# A 2 KB zenoh batch alone spans 16 of the 128-byte TX buffers; the default 36
# gave _Z_ERR_TRANSPORT_TX_FAILED on the fourth declaration of the startup burst.
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=24

# WiFi connection management: conn_mgr + stored credentials, with the
# CONNECTIVITY_WIFI_MGMT implementation from the rosterloh-drivers module.
# Provision over the shell: wifi cred add -s <ssid> -k 1 -p <psk>
CONFIG_WIFI=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_CONNECTIVITY_WIFI_MGMT=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CONNECTIVITY=y
CONFIG_NET_L2_WIFI_SHELL=y
# CONFIG_ESP_HEAP_RUNTIME=n
# CONFIG_NET_LOG=y
# CONFIG_NET_SHELL=y
