# Application
# 4096, not 3072: picoros_{node,publisher,subscriber}_declare() each build an
# rmw_zenoh key expression in a 400-byte stack buffer (KEYEXPR_SIZE), and the
# liveliness variant adds a 124-byte mangled-topic buffer on top, all from
# main() via app_picoros_init().
#
# This costs 5 KB of DRAM, not 1 KB. zenoh-pico's Zephyr platform layer sizes
# its pool of preallocated pthread stacks at CONFIG_MAIN_STACK_SIZE
# (Z_PTHREAD_STACK_SIZE_DEFAULT in src/system/zephyr/system.c), so raising main
# raises all CONFIG_ZENOH_PICO_THREADS_NUM (4) of them too:
# thread_stack_area grows 12 KB -> 16 KB. If DRAM gets tight -- and it is
# already tight enough here that LVGL had to move to the libc heap -- the lever
# is CONFIG_ZENOH_PICO_THREADS_NUM, since this app only ever starts the read
# and lease tasks.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_SHELL=y
CONFIG_REBOOT=y

# Flash and Settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# Firmware upgrade (MCUboot OTA receiver)
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# MCUmgr: SMP protocol for OTA image upload and OS management
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# SMP over shell UART (shares existing console - use mcumgr CLI or nRF Connect)
CONFIG_BASE64=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y

# SMP over Bluetooth for wireless OTA
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="rasprover"
CONFIG_BT_MAX_CONN=1

# Pico-ROS: appear on the host ROS 2 graph as an rmw_zenoh node over WiFi TCP.
# CONFIG_APP_PICOROS selects CONFIG_PICOROS, which pulls in zenoh-pico with
# publication, subscription and multi-threading; only the link type is left to
# the application. Services (queryables) are not used, so ZENOH_PICO_QUERY and
# ZENOH_PICO_QUERYABLE stay off -- see CONFIG_PICOROS_SERVICES.
CONFIG_APP_PICOROS=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y
CONFIG_APP_TIME_SYNC=y
# zenoh-pico uses malloc (libc heap), not k_heap; keep k_heap just for BT/MCUmgr
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Drivers
CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SENSOR=y

# Motors: h-bridge actuators + PCNT encoders
CONFIG_ACTUATOR=y
CONFIG_ACTUATOR_HBRIDGE=y
CONFIG_ACTUATOR_HBRIDGE_ENCODER=y
CONFIG_PWM=y

# Gimbal: UART bus servos exposed as actuators
CONFIG_BUS_SERVO=y
CONFIG_ACTUATOR_BUS_SERVO=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_APP_GIMBAL=y

# OLED Display
CONFIG_APP_DISPLAY=y
# lv_timer_handler() needs far more stack than the 1536-byte system workqueue,
# which it silently overran into the neighbouring thread's stack. Give the UI
# its own queue rather than inflating a workqueue shared with BT and net.
# Measured peak for this screen is 3300-3428 B across runs. 5120 keeps a third
# of the stack spare: overflowing it corrupts a neighbour silently rather than
# faulting, so this is sized for margin, not for the measurement. Re-check with
# `kernel thread list` if the screen gains widgets.
CONFIG_APP_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_APP_DISPLAY_DEDICATED_THREAD_STACK_SIZE=5120
# LVGL is not thread-safe and app_display_update_power() runs on the main
# thread, so app_display.c takes lvgl_lock() around every LVGL call.
CONFIG_LV_Z_LVGL_MUTEX=y
# Monochrome SSD1306: render at 1 bpp. Without this LVGL defaults to 16-bit
# colour, so the Zephyr glue never allocates the mono conversion buffer
# (ALLOC_MONOCHROME_CONV_BUFFER is gated on a 1-bpp build) yet still selects
# the mono flush path at runtime -> NULL mono_conv_buf deref on first render.
CONFIG_LV_COLOR_DEPTH_1=y
# CONFIG_LVGL=y
# CONFIG_LV_CONF_MINIMAL=y
# LVGL allocates from the C-library (runtime) heap rather than a dedicated
# static .noinit pool: dram0_0_seg static window is full (a >4K static pool
# overflows the link), whereas the runtime malloc heap has room.
CONFIG_LV_Z_MEM_POOL_HEAP_LIB_C=y
# The default theme's runtime style allocations don't fit in the ~5K spare
# DRAM heap; use the lightweight mono theme for the 128x32 OLED instead.
CONFIG_LV_USE_THEME_DEFAULT=n
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_DHCPV4=y

# WiFi connection management: conn_mgr + stored credentials, with the
# CONNECTIVITY_WIFI_MGMT implementation from the rosterloh-drivers module.
# Provision over the shell: wifi cred add -s <ssid> -k 1 -p <psk>
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_CONNECTIVITY_WIFI_MGMT=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CONNECTIVITY=y
CONFIG_NET_L2_WIFI_SHELL=y
# CONFIG_ESP_HEAP_RUNTIME=n
# CONFIG_NET_LOG=y
# CONFIG_NET_SHELL=y
