tests:
  rasprover.picoserdes:
    tags:
      - rasprover
      - ros
      - cdr
      - picoros
    # The code under test is pure, so this would ideally run on `unit_testing`.
    # It cannot: Zephyr's ztest registration uses ELF iterable sections, and
    # Mach-O rejects the section attribute, so unit_testing does not build on
    # macOS. native_sim is Linux-only. qemu_cortex_m3 runs anywhere the Zephyr
    # SDK does (it ships the QEMU binary), including this macOS dev host.
    # No Xtensa ESP /qemu board: float code traps EXCCAUSE 32 there, as Zephyr
    # never sets CPENABLE on ESP, even with CONFIG_FPU=y.
    platform_allow:
      - qemu_cortex_m3
      - native_sim/native/64
      - adafruit_qt_py_esp32c3/esp32c3/qemu
    integration_platforms:
      - qemu_cortex_m3
      - adafruit_qt_py_esp32c3/esp32c3/qemu
