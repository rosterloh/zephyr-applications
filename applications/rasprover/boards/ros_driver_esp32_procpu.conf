# Coredump to the 4 KB `coredump` flash partition, here rather than in prj.conf
# because native_sim has no coredump support. Read it back over the shell with
# `coredump find`, `coredump print` and `coredump erase`.
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
CONFIG_DEBUG_COREDUMP_SHELL=y

# The partition cannot hold RAM, so keep the faulting thread's registers and
# the top 2 KB of its stack; the default limit is unbounded.
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_DEBUG_COREDUMP_THREAD_STACK_TOP_LIMIT_FOR_CURRENT=2048
