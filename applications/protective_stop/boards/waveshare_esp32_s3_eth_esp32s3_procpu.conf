# Uplinks: the onboard W5500 (SPI2) and the ESP32-S3's WiFi station, both on
# DHCP. uplink.c prefers Ethernet; wifi.c leaves WiFi while it holds a lease.
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# Two interfaces, the HTTP server and four machine sockets.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# The 16-LED ring and the onboard status pixel (WS2812 over RMT).
CONFIG_LED_STRIP=y

# A fatal error leaves a coredump in the coredump flash partition for
# GET /api/coredump. The partition is 4 KiB, so only the faulting thread's
# registers and stack are kept.
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
