CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# pstop_c protocol library, vendored as a Zephyr module (deps/modules/lib/protective-stop)
CONFIG_PSTOP=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
