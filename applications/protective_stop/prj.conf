CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# pstop_c protocol library, vendored as a Zephyr module (deps/modules/lib/protective-stop)
CONFIG_PSTOP=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# Home Assistant over the ESPHome native API (PROTECTIVE_STOP_ESPHOME). The
# hostname, made unique from the MAC, is the name Home Assistant shows.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="pstop"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_NET_IPV4_IGMP=y
CONFIG_ESPHOME_API_FRIENDLY_NAME="Protective stop"

# Control plane: /state.json, /api/*, /admin/api/*
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_HTTP_SERVER_MAX_CLIENTS=2
CONFIG_HTTP_SERVER_VERSION_2=n

CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# POST bodies of /admin/api/wifi and /admin/api/settings
CONFIG_JSON_LIBRARY=y

# Device id from the factory MAC
CONFIG_HWINFO=y
