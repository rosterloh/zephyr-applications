      - protective_stop
      - pstop
      - http
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    extra_configs:
      - CONFIG_PROTECTIVE_STOP_ADMIN_PASSWORD=""
