# MCUboot configuration for the Adafruit QT Py ESP32-C3.
#
# Image signing: none for development. Switch to
# CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256 before production and generate a key
# pair with: west sign --tool imgtool --key <key.pem>
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_VALIDATE_SLOT0=n

# Silent bootloader - the application console is USB-CDC; keep MCUboot quiet so
# it doesn't hold the UART or emit noise before the app banner.
CONFIG_BOOT_BANNER=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
