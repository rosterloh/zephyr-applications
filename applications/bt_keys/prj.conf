# Application
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_LOG=y
CONFIG_REBOOT=y

# Shell (over the USB-CDC console) for inspecting/remapping the keymap
CONFIG_SHELL=y

# NeoKey 1x4: seesaw MFD stack over the STEMMA QT I2C bus
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_MFD=y
CONFIG_MFD_ADAFRUIT_SEESAW=y
CONFIG_GPIO_ADAFRUIT_SEESAW=y
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_ADAFRUIT_SEESAW=y

# Bluetooth HID-over-GATT (HoG) keyboard peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="bt_keys"
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL="bt_keys"
CONFIG_BT_DIS_MANUF="rosterloh"
CONFIG_BT_BAS=y
# esp32 BLE host RX thread needs more than the 1200-byte default (zephyr#114394)
CONFIG_BT_RX_STACK_SIZE=2048

# Bigger ATT MTU improves OTA image-upload throughput
CONFIG_BT_L2CAP_TX_MTU=252
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Persistent storage: BT bonds + saved keymap
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# OTA over Bluetooth: MCUmgr SMP transport + MCUboot image management
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
