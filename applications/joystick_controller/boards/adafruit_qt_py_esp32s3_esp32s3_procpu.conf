# Wi-Fi via conn_mgr + stored credentials (rosterloh-drivers wifi_connectivity).
# Provision over the shell: wifi cred add -s <ssid> -k 1 -p <psk>
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_CONNECTION_MANAGER_CONNECTIVITY_WIFI_MGMT=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CONNECTIVITY=y
CONFIG_NET_L2_WIFI_SHELL=y
# Wi-Fi reconnect runs on the system workqueue (see rasprover prj.conf).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

CONFIG_I2C=y
