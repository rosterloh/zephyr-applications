CONFIG_LOG=y
CONFIG_SHELL=y

# Bootloader
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Settings: persists analog-axis calibration (teleop cal)
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# Inputs: analog-axis + gpio-keys from devicetree
CONFIG_INPUT=y
CONFIG_ADC=y

# Networking. The link (Wi-Fi or Ethernet) comes from the board .conf.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DNS_RESOLVER=y
# A 2 KB zenoh batch spans 16 of the 128-byte TX buffers (see rasprover).
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=24

# Pico-ROS / zenoh-pico. Sizing rationale in applications/rasprover/prj.conf.
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_THREADS_NUM=2
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=73728
CONFIG_MAX_PTHREAD_MUTEX_COUNT=32
CONFIG_MAX_PTHREAD_COND_COUNT=16
