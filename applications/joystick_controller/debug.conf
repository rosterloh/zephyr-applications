# compiler
CONFIG_DEBUG_OPTIMIZATIONS=y

# Make Logging more responsive for better visualization
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1

# Shell Testing
CONFIG_I2C_SHELL=y
# Bench bring-up: `input dump on` for stick events, `gpio get` for the
# enable/mod/grasp switches, `net iface` for the link and DHCP state.
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_EVENT_DUMP=y
CONFIG_GPIO_SHELL=y
CONFIG_NET_SHELL=y
