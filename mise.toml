[tools]
python = "3.14"
uv = "latest"
cmake = "latest"
ninja = "latest"
ccache = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

# Remaining Ubuntu host deps from deps/zephyr/doc/develop/getting_started/index.rst
# that have no mise dev-tool backend (no upstream GitHub releases / not
# version-managed tools) — installed via apt through `mise bootstrap`.
[bootstrap.packages]
"apt:gperf" = "latest"
"apt:dfu-util" = "latest"
"apt:device-tree-compiler" = "latest"
"apt:wget" = "latest"
"apt:python3-dev" = "latest"
"apt:python3-tk" = "latest"
"apt:xz-utils" = "latest"
"apt:file" = "latest"
"apt:make" = "latest"
"apt:gcc" = "latest"
"apt:gcc-multilib" = "latest"
"apt:g++-multilib" = "latest"
"apt:libsdl2-dev" = "latest"
"apt:libmagic1" = "latest"

[tasks.sync]
run = "uv sync"
description = "Install/update Python deps from uv.lock into .venv"

[tasks.fmt]
run = "ruff format"
description = "Format Python (ruff, line-length 120)"

[tasks."clean-twister"]
run = "find . \\( -path ./deps -o -path ./.venv \\) -prune -o -type d -name 'twister-out*' -prune -exec rm -rf {} +"
description = "Remove all twister-out* directories anywhere in the tree"

[tasks.setup]
run = "mise run west-update && mise run sdk-install && mise run blobs-fetch && mise run patch-zenoh"
description = "First-time workspace setup: fetch west deps, install Zephyr SDK, fetch binary blobs, apply patches. Safe to re-run."

[tasks."west-update"]
run = "west update --narrow"
description = "Fetch/update all west dependencies into deps/"

[tasks."blobs-fetch"]
run = "west blobs fetch hal_espressif hal_infineon"
description = "Fetch required binary blobs: Espressif HAL (WiFi/BLE firmware) and Infineon HAL (CYW43439 firmware for pico_fw, Nicla Vision)."

[tasks."sdk-install"]
description = "Install Zephyr SDK toolchains for this project's targets (version read from deps/zephyr/SDK_VERSION)."
run = """
set -e
SDK_VER=$(cat "${MISE_PROJECT_ROOT}/deps/zephyr/SDK_VERSION")
west sdk install --version "$SDK_VER" \
  ${GITHUB_TOKEN:+--personal-access-token "$GITHUB_TOKEN"} \
  -t arm-zephyr-eabi \
     riscv64-zephyr-elf \
     xtensa-espressif_esp32_zephyr-elf \
     xtensa-espressif_esp32s3_zephyr-elf
"""

[tasks."patch-zenoh"]
description = "Patch zenoh-pico Zephyr integration: add src/runtime sources, generate include/zenoh-pico/config.h from CONFIG_APP_ZENOH_*. Idempotent."
run = '''
set -e
ZENOH_DIR="${MISE_PROJECT_ROOT}/deps/modules/lib/zenoh"
CMAKE="${ZENOH_DIR}/zephyr/CMakeLists.txt"
CONFIG_H="${ZENOH_DIR}/include/zenoh-pico/config.h"

# 0. Zephyr removed the legacy generated-include path (bare <version.h>);
# rewrite zenoh-pico's includes to the <zephyr/version.h> form. Idempotent.
for f in include/zenoh-pico/system/platform/zephyr.h \
         src/system/zephyr/system.c \
         src/link/transport/serial/uart_zephyr.c; do
    sed -i.bak 's|#include <version.h>|#include <zephyr/version.h>|' "${ZENOH_DIR}/${f}"
    rm -f "${ZENOH_DIR}/${f}.bak"
done

# 1. Add src/runtime/*.c to the Zephyr module's source glob. Upstream's
# zephyr/CMakeLists.txt omits it even though the root CMakeLists globs it, so
# the executor sources (src/runtime/{executor,background_executor}.c, whose
# symbols are referenced across src/api, src/net, src/session, src/transport)
# go undefined at link time; tracked in eclipse-zenoh/zenoh-pico#1232. Every
# other part of that file now matches upstream, so we inject only the one
# missing glob line rather than rewriting the whole file. Idempotent.
grep -q 'src/runtime/\*\.c' "$CMAKE" || sed -i.bak 's|\(  "\.\./src/protocol/\*\.c"\)|\1\
  "../src/runtime/*.c"|' "$CMAKE"
rm -f "$CMAKE.bak"
echo "zenoh zephyr/CMakeLists.txt: src/runtime glob ensured"

# 2. Generate include/zenoh-pico/config.h. Upstream's zephyr/CMakeLists.txt
# does not run configure_file(config.h.in config.h), so the header that
# system/platform.h includes is missing on the west-module path (upstream bug
# eclipse-zenoh/zenoh-pico#1227; the configure_file flow is the subject of the
# pending PR #1083). We synthesise a minimal version that pulls numeric tunables
# from the application's Kconfig (CONFIG_APP_ZENOH_*); Z_FEATURE_* macros are
# still injected via -D from zephyr/CMakeLists.txt. Always overwritten so it
# tracks Kconfig renames.
cat > "$CONFIG_H" <<'EOF'
/* Auto-generated by mise patch-zenoh - do not edit. */
#ifndef INCLUDE_ZENOH_PICO_CONFIG_H
#define INCLUDE_ZENOH_PICO_CONFIG_H

#ifndef Z_FEATURE_UNSTABLE_API
#define Z_FEATURE_UNSTABLE_API 0
#endif
#ifndef Z_FEATURE_CONNECTIVITY
#define Z_FEATURE_CONNECTIVITY 0
#endif
#ifndef Z_FEATURE_PUBLICATION
#define Z_FEATURE_PUBLICATION 1
#endif
#ifndef Z_FEATURE_ADVANCED_PUBLICATION
#define Z_FEATURE_ADVANCED_PUBLICATION 0
#endif
#ifndef Z_FEATURE_SUBSCRIPTION
#define Z_FEATURE_SUBSCRIPTION 1
#endif
#ifndef Z_FEATURE_ADVANCED_SUBSCRIPTION
#define Z_FEATURE_ADVANCED_SUBSCRIPTION 0
#endif
#ifndef Z_FEATURE_QUERY
#define Z_FEATURE_QUERY 1
#endif
#ifndef Z_FEATURE_QUERYABLE
#define Z_FEATURE_QUERYABLE 1
#endif
#ifndef Z_FEATURE_LIVELINESS
#define Z_FEATURE_LIVELINESS 1
#endif
#ifndef Z_FEATURE_INTEREST
#define Z_FEATURE_INTEREST 1
#endif
#ifndef Z_FEATURE_FRAGMENTATION
#define Z_FEATURE_FRAGMENTATION 1
#endif
#ifndef Z_FEATURE_ENCODING_VALUES
#define Z_FEATURE_ENCODING_VALUES 1
#endif
#ifndef Z_FEATURE_MULTI_THREAD
#define Z_FEATURE_MULTI_THREAD 1
#endif
#ifndef Z_FEATURE_LINK_TCP
#define Z_FEATURE_LINK_TCP 1
#endif
#ifndef Z_FEATURE_LINK_BLUETOOTH
#define Z_FEATURE_LINK_BLUETOOTH 0
#endif
#ifndef Z_FEATURE_LINK_WS
#define Z_FEATURE_LINK_WS 0
#endif
#ifndef Z_FEATURE_LINK_SERIAL
#define Z_FEATURE_LINK_SERIAL 0
#endif
#ifndef Z_FEATURE_LINK_SERIAL_USB
#define Z_FEATURE_LINK_SERIAL_USB 0
#endif
#ifndef Z_FEATURE_LINK_TLS
#define Z_FEATURE_LINK_TLS 0
#endif
#ifndef Z_FEATURE_SCOUTING
#define Z_FEATURE_SCOUTING 1
#endif
#ifndef Z_FEATURE_LINK_UDP_MULTICAST
#define Z_FEATURE_LINK_UDP_MULTICAST 1
#endif
#ifndef Z_FEATURE_LINK_UDP_UNICAST
#define Z_FEATURE_LINK_UDP_UNICAST 1
#endif
#ifndef Z_FEATURE_MULTICAST_TRANSPORT
