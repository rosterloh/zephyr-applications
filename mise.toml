echo "zenoh config.h written to $CONFIG_H"
'''

[tasks.app]
description = "Build a Zephyr application for its default (or an explicitly allowed) board."
usage = '''
arg "<app>" help="App name (motor_controller, joystick_controller, embedded_vision, force_sensor, bt_keys, powerbread, pico_fw, pt_mcp, rasprover, data_collection, rp2350_poe_eth)"
flag "-b --board <board>" help="Override target board (must be in app's allowed list)"
flag "--sysbuild" help="Build with sysbuild (e.g. for MCUboot integration)"
'''
run = """
set -e
case "${usage_app}" in
    motor_controller)     ALLOWED="robotis_openrb_150"; DEFAULT="robotis_openrb_150" ;;
    joystick_controller)  ALLOWED="adafruit_qt_py_esp32s3/esp32s3/procpu"; DEFAULT="adafruit_qt_py_esp32s3/esp32s3/procpu" ;;
    embedded_vision)      ALLOWED="arduino_nicla_vision/stm32h747xx/m7"; DEFAULT="arduino_nicla_vision/stm32h747xx/m7" ;;
    force_sensor)         ALLOWED="adafruit_qt_py_esp32c3"; DEFAULT="adafruit_qt_py_esp32c3" ;;
    bt_keys)              ALLOWED="adafruit_qt_py_esp32c3 adafruit_qt_py_esp32s3@psram/esp32s3/procpu"; DEFAULT="adafruit_qt_py_esp32c3" ;;
    powerbread)           ALLOWED="adafruit_qt_py_esp32c3 native_sim/native/64"; DEFAULT="adafruit_qt_py_esp32c3" ;;
    pico_fw)              ALLOWED="rpi_pico/rp2040/w"; DEFAULT="rpi_pico/rp2040/w" ;;
    pt_mcp)               ALLOWED="xiao_esp32c5/esp32c5/hpcore"; DEFAULT="xiao_esp32c5/esp32c5/hpcore" ;;
    rasprover)            ALLOWED="ros_driver/esp32/procpu native_sim/native/64"; DEFAULT="ros_driver/esp32/procpu" ;;
    data_collection)      ALLOWED="esp32p4_nano/esp32p4/hpcore"; DEFAULT="esp32p4_nano/esp32p4/hpcore" ;;
    rp2350_poe_eth)       ALLOWED="rp2350_poe_eth/rp2350a/m33/mcuboot"; DEFAULT="rp2350_poe_eth/rp2350a/m33/mcuboot" ;;
    *) echo "unknown app: ${usage_app}" >&2; exit 2 ;;
esac

BOARD="${usage_board:-$DEFAULT}"
if ! printf '%s\\n' $ALLOWED | grep -qx "$BOARD"; then
    echo "board '$BOARD' not allowed for ${usage_app}" >&2
    echo "allowed: $ALLOWED" >&2
    exit 2
fi

EXTRA=""
[ "${usage_sysbuild}" = "true" ] && EXTRA="--sysbuild"

west build -b "$BOARD" -p always $EXTRA --build-dir builds/${usage_app} applications/${usage_app}
"""

[tasks.flash]
description = "Flash a previously built application."
usage = '''
arg "<app>" help="App name (e.g. motor_controller)"
'''
run = "west flash --build-dir builds/${usage_app}"

[tasks."check-skills"]
run = "python scripts/check_skill_symbols.py"
description = "Validate CONFIG_* symbols cited in .claude/skills/ against deps/, and flag stale skill validation stamps."

[tasks."run-rasprover-sim"]
run = "west build -b native_sim/native/64 --build-dir builds/rasprover -t run applications/rasprover"
description = "Run an already-built native_sim rasprover image."

[tasks."agent-build"]
description = "Build with tail-truncated log output. Usage: [TAIL_S=5] [TAIL_F=50] mise run agent-build [--board <board>] [--sysbuild] <app>"
usage = '''
arg "<app>" help="App name (e.g. motor_controller)"
flag "-b --board <board>" help="Override target board"
flag "--sysbuild" help="Build with sysbuild"
'''
run = """
set -e
mkdir -p logs
TAIL_S="${TAIL_S:-5}"
TAIL_F="${TAIL_F:-50}"
LOG="logs/${usage_app}-build.log"

ARGS=""
[ -n "${usage_board}" ] && ARGS="$ARGS --board ${usage_board}"
[ "${usage_sysbuild}" = "true" ] && ARGS="$ARGS --sysbuild"

if mise run app $ARGS ${usage_app} > "$LOG" 2>&1; then
    echo "Build succeeded"
    tail -$TAIL_S "$LOG"
else
    EXIT_CODE=$?
    echo "Build failed (exit code: $EXIT_CODE)"
    tail -$TAIL_F "$LOG"
    exit $EXIT_CODE
fi
"""
