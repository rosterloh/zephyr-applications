default_language_version:
  python: python3.14
# SVDs: vendor-supplied, don't reformat.
# Patches: byte-exact artifacts, sha256'd in zephyr/patches.yml -- and stripping
# trailing whitespace eats the leading space on a blank diff context line.
exclude: (\.vscode/svd/.*\.svd|zephyr/patches/.*\.patch)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: (.*\.vscode\/.+json|.+code-workspace) # vscode </3 LF
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: uv run clang-format -i
        language: system
        types_or: [c, c++]
