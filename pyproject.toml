[project]
name = "zephyr-applications"
version = "1.0.0"
requires-python = ">=3.14,<4.0"

[dependency-groups]
dev = [
  "anytree>=2.13.0",
  "cbor>=1.0.0",
  "clang-format>=23.1.0",
  "colorama>=0.4.6",
  "coverage>=7.15.4",
  "esptool>=5.3.1",
  "gcovr>=8.6",
  "gitlint-core>=0.19.1",
  "gitpython>=3.1.60",
  "graphviz>=0.21",
  "intelhex>=2.3.0",
  "jsonschema>=4.26.0",
  "junit2html>=31.1.4",
  "junitparser>=5.0.1",
  "lxml>=6.1.2",
  "mypy>=2.3.1",
  "natsort>=8.4.0",
  "numpy>=2.5.2",
  "opencv-python>=5.0.0.93",
  "packaging>=25.0",
  "patool>=4.0.5",
  "pillow>=12.3.0",
  "ply>=3.10",
  "pre-commit>=4.6.2",
  "protobuf>=6.33.1",
  "psutil>=7.2.2",
  "pyelftools>=0.33",
  "pygithub>=2.10.0",
  "pykwalify>=1.8.0",
  "pylink-square>=1.7.0",
  "pylint>=4.0.7",
  "pyocd>=0.44.1",
  "pyserial>=3.5",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-env>=1.6.0",
  "python-magic>=0.4.27 ; sys_platform != 'win32'",
  "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
  "pyyaml>=6.0.3",
  "requests>=2.34.2",
  "ruff==0.16.5",
  "semver>=3.0.4",
  "tabulate>=0.9.0",
  "tqdm>=4.68.4",
  "unidiff>=0.7.5",
  "west>=1.5.0",
  "windows-curses>=2.4.2 ; sys_platform == 'win32'",
  "yamllint>=1.37.1",
  "zephyr-kconfig>=0.2.1",
]

[tool.ruff]
line-length = 120
fix = true
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "B", "Q", "I", "ASYNC", "T20"]
ignore = ["F401", "E501", "T201"]

[tool.ruff.lint.flake8-tidy-imports]
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest".msg = "Use `pytest` instead."

[tool.mypy]
strict = true
python_version = "3.14"
ignore_missing_imports = true

# from https://blog.wolt.com/engineering/2021/09/30/professional-grade-mypy-configuration/
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = false

disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_unimported = false

[tool.pytest.ini_options]
# Only collect this repo's own tests; keep pytest out of deps/ where upstream
# module test scripts call sys.exit() at import and abort collection.
testpaths = ["tests"]
